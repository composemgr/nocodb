name: nocodb
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: nocodb/nocodb:latest
    container_name: nocodb-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: nocodb-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      # Database connection
      NC_DB: pg://${DB_USER_NAME:-nocodb}:${DB_USER_PASS:-changeme_db_password}@nocodb-db:5432?d=${DB_CREATE_DATABASE_NAME:-nocodb}
      # Public URL
      NC_PUBLIC_URL: https://${BASE_HOST_NAME:-$HOSTNAME}
      # Auth
      NC_AUTH_JWT_SECRET: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      NC_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@example.com}
      NC_ADMIN_PASSWORD: ${APP_ADMIN_PASS:-changeme_admin_password}
      # Email
      NC_SMTP_HOST: ${EMAIL_SERVER_HOST:-172.17.0.1}
      NC_SMTP_PORT: ${EMAIL_SERVER_PORT:-587}
      NC_SMTP_USERNAME: ${EMAIL_SERVER_LOGIN_NAME:-}
      NC_SMTP_PASSWORD: ${EMAIL_SERVER_LOGIN_PASS:-}
      NC_SMTP_FROM: ${EMAIL_SERVER_MAIL_FROM:-no-reply@example.com}
      NC_SMTP_SECURE: "false"
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/data/nocodb:/usr/app/data:z'
    depends_on:
      db:
        condition: service_healthy
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://nocodb-app:8080'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - nocodb
      - cloudflare

  db:
    image: postgres:latest
    container_name: nocodb-db
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: nocodb-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: nocodb-db
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-nocodb}
      POSTGRES_USER: ${DB_USER_NAME:-nocodb}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
    volumes:
      - './volumes/data/db/postgres/nocodb:/var/lib/postgresql/data:z'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nocodb

networks:
  nocodb:
    name: nocodb
    external: false
  cloudflare:
    external: true
